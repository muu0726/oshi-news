name: 毎朝ニュース自動取得・AI要約 Cron

on:
  schedule:
    # 毎朝 5:00 JST (20:00 UTC) に自動実行
    - cron: '0 20 * * *'
  workflow_dispatch:
    # GitHub画面からの手動実行も可能

jobs:
  daily-news-job:
    runs-on: ubuntu-latest
    steps:
      - name: 推しニュース API のCronトリガーを起動
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/cron/daily-news" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
